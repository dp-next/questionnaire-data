[project]
name = "questionnaire-data"
version = "0.1.0"
description = "Data package for the questionnaire from Work Package 3 of the DP-Next project."
authors = [
  { name = "Kristiane Beicher", email = "kris.beicher@clin.au.dk" },
  { name = "Signe Kirk Brødbæk", email = "signekb@clin.au.dk" },
  { name = "Luke W. Johnston", email = "lwjohnst@gmail.com" },
  { name = "Marton Vago", email = "martonvago@gmail.com" },
  # TODO: Add the other authors (Kristina, Daniel, Jonas, Mikkel, etc)
]
maintainers = [
  { name = "Kristiane Beicher", email = "kris.beicher@clin.au.dk" },
  { name = "Signe Kirk Brødbæk", email = "signekb@clin.au.dk" },
  { name = "Luke W. Johnston", email = "lwjohnst@gmail.com" },
  { name = "Marton Vago", email = "martonvago@gmail.com" },
]
readme = "README.md"
license = "MIT AND CC0-1.0"
license-files = ["LICENSE-MIT.md", "LICENSE.md"]
requires-python = ">=3.12"
dependencies = [
  "dotenv>=0.9.9",
  "polars>=1.42.1",
  "pytask>=0.6.0",
  "requests>=2.34.2",
  "seedcase-flower>=0.30.1",
  "seedcase-soil>=0.16.0",
  "seedcase-sprout>=0.51.0",
]

[dependency-groups]
dev = ["jupyter>=1.1.1", "types-requests>=2.33.0.20260906"]

[project.urls]
homepage = "https://dp-next.github.io/questionnaire-data"
repository = "https://github.com/dp-next/questionnaire-data"
issues = "https://github.com/dp-next/questionnaire-data/issues"
changelog = "https://github.com/dp-next/questionnaire-data/blob/main/CHANGELOG.md"

[tool.ruff]
extend = ".config/ruff.toml"

[tool.pyrefly]
project-includes = ["src/"]
min-severity = "warn"
python-version = "3.12.0"
preset = "strict"
python-interpreter-path = ".venv/bin/python"
# Use inline `# type: ignore` comments, which can be useful.
permissive-ignores = true

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.pytask.ini_options]
paths = ["src/questionnaire_data"]
task_files = ["task_*.py", "build.py"]

# Setting up markers for phases of a build pipeline
[tool.pytask.ini_options.markers]
metadata = "Tasks to process and build the metadata for the data package."
raw = "Tasks to download and save data (and maybe metadata) from different source locations into 'raw/'."
staging = "Tasks to process data from 'raw/' to 'staging/'."

[tool.seedcase-flower]
style = "quarto-resource-tables"
output-dir = "docs/metadata"
